name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-22.04
          - target: macos-arm64
            os: macos-15
          - target: macos-x64
            os: macos-15-intel

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            harness/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify release version
        run: node scripts/verify-release-version.mjs

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Build self-contained platform release
        run: pnpm run build
        env:
          CI: "true"

      - name: Smoke-test Windows portable application
        if: runner.os == 'Windows'
        run: pnpm run test:release

      - name: Verify checksums and expected platform artifacts
        run: node scripts/verify-built-artifacts.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release asset set
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          required=(
            "DeepSeek-Harness-Desktop-${version}-windows-x64-portable.zip"
            "DeepSeek-Harness-Desktop-${version}-linux-x64.AppImage"
            "DeepSeek-Harness-Desktop-${version}-linux-x64.deb"
            "DeepSeek-Harness-Desktop-${version}-macos-arm64.dmg"
            "DeepSeek-Harness-Desktop-${version}-macos-x64.dmg"
          )
          for asset in "${required[@]}"; do
            test -s "release-assets/${asset}"
            test -s "release-assets/${asset}.sha256"
          done
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "DeepSeek Harness Desktop $GITHUB_REF_NAME"
          fi

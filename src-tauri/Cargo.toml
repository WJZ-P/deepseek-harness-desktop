[package]
name = "deepseek-harness-desktop"
version = "1.0.1"
description = "A lightweight, cross-platform Tauri desktop shell for DeepSeek Harness"
authors = ["WJZ_P"]
edition = "2024"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dunce = "1"
